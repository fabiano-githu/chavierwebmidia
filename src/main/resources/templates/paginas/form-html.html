<#include "/layouts/header.html">

<h2>${botaoTexto}</h2>

<form action="${acao}" method="post">
    <input type="hidden" name="id" value="${projeto.id!}">

    <label>Título</label>
    <input type="text" name="titulo" value="${projeto.titulo!}" required>

    <label>Descrição</label>
    <textarea name="descricao" required>${projeto.descricao!}</textarea>

    <label>Link</label>
    <input type="text" name="link" value="${projeto.link!}">

    <button type="submit">${botaoTexto}</button>
</form>

<a href="/portfolio">Voltar para Portfólio</a>

<#include "/layouts/footer.html">
